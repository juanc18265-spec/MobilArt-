name: Keep Alive (Render + Supabase)

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MobilArt on Render
        run: |
          echo "Pinging MobilArt on Render..."
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" https://mobilart.onrender.com || true

      - name: Ping Supabase (prevent project pause)
        run: |
          echo "Pinging Supabase to keep project active..."
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVncmFibGJxd3JrZHVleHBpc2ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzkyMTEsImV4cCI6MjA5NjExNTIxMX0.BfaIhGYD6HBS10lzPqkHrKLYYEClx4DG-MJcM1WcwF0" \
            "https://ugrablbqwrkduexpisfg.supabase.co/rest/v1/app_settings?select=key&limit=1" || true
          echo "Done!"
